<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA &C0 - paymentMethode</title>
     <link rel="icon" href="./image/aura-logo.svg" type="image/icons">
    <style>
        .payment{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            align-content: center;
            padding: 60px 40px;
            position: relative;
        }
        .arrowLeft{
            position: absolute;
            font-size: 50px;
            color: black;
            font-weight: bold;
            top: 10px;
            left: 20px;
            cursor:default;
        }
        .arrowRight{
            position: absolute;
            font-size: 50px;
            color: black;
            font-weight: bold;
            bottom: 10px;
            right: 20px;
            cursor:default;

        }
        h2{
            font-weight: 500;
            font-size: 30px;
            margin: 20px;
            cursor:default;
        }
        .Methods{
          margin: 100px 0;
          justify-content: center;
          display: flex;
          gap: 100px;
          flex-wrap: wrap;

        }
        .MethodMTN{
            width: 170px;
            height: 100px;
            justify-content: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: none;
            cursor: pointer;
            background: #ffcc00;
            
        }
        .my{
            font-weight: 500;
    
        }
        .mtnLogo{
            font-size: 22px;
            border: 2px solid #000;
            border-radius: 50px;
            padding: 2px 14px ;
        }
        .MethodMTN:hover{
            transform: translateY(-5px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }
        .MethodOrg{
            width: 170px;
            height: 100px;
            justify-content: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: none;
            cursor: pointer;
            background: #ff6600;
            color: white;
            
        }
        .MethodOrg:hover{
            transform: translateY(-5px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }
        .orgLogo{
            font-size: 22px;
            font-weight: 500;
        }
        .orgLogo sup{
            font-size: 10px;
            font-weight: 400;
        }

    </style>
</head>
<body>
    <div class="payment">
        <div class="arrowLeft"><span style='font-size:100px;'>&#8600;</span></div>
        <h2>Payment Methods</h2>
        <div class="Methods">
            <button class="MethodMTN" onclick="window.location.href='confirmPayment.html'">
                <span class="my">my</span><br>
                <div class="mtnLogo">MTN</div>
            </button>

            <button class="MethodOrg" onclick="window.location.href='confirmPayment2.html'">
                <span class="orgLogo">orange<sup>TM</sup></span>
            </button>
        </div>
        <div class="arrowRight"><span style='font-size:100px;'>&#8598;</span></div>
    </div>
    
</body>
</html>
