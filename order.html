<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order-summary</title>
    <link rel="icon" href="./image/aura-logo.svg" type="image/icons">
</head>
<style>
      :root{
    --gold:#c99a3b;
    --gold-dark:#b8862a;
    --navy:#0b1440;
    --lavender:#e7e9fb;
    --tan:#e9d6ae;
    --ink:#14141a;
    --muted:#5c5c66;
    --line:#e4e2da;
    --cream:#fdfcf9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 6%;
    background: whitesmoke;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;
  }
  header a{text-decoration:none;color:inherit;}
  header ul{list-style:none;}
  header button{font-family:inherit;cursor:pointer;border:none;}
  nav ul{display:flex;gap:36px;font-weight:600;font-size:0.95rem;}
  nav a{position:relative;transition:color .2s;}
  nav a:hover{color:green;}
  .header-icons{display:flex;gap:20px;align-items:center;font-size:1.1rem;}
  .header-icons button{background:none;color:#fdfcf9;font-size:1.15rem;position:relative;}
  .logo{font-weight:500;font-size:0.5rem;letter-spacing:1px; align-items: center; display: flex;flex-direction: column;}
  .logo img{width: 30px; height: 30px;}
  .logo span{font-weight: bolder; color: green;}

  .container{
    display:flex;
    justify-content: center;
    flex-direction: column;
    background: linear-gradient(90deg, rgb(176, 233, 176), rgb(241, 243, 241));
    margin: 50px auto;
    width: fit-content;
    border: none;
    border-radius: 5px;
  }
  .arrow-left{
    width: 30px;
    height: 30px;
    margin-left: 30px;
    cursor: pointer;
  }
  .header{
    font-size: 32px;
    color: white;

  }
  .section{
    border-bottom: 1px solid black;
    border-top: 1px solid black;
    margin: 20px 0;
    text-align: center;
  }
  .title{
    display: flex;
    justify-content: space-between;
    gap: 150px;
    margin: 7px 10px;
    color: black;
  }
  .product-1{
   margin-bottom: 50px;
   padding: 10px 0;
   color: black;
   font-weight: 200;
 }
  .product-2{
   margin-bottom: 20px;
   padding: 10px 0;
   color: black;
  }
  .button-btn{
    display: flex;
    justify-content: space-between;
    margin: 10px 0;

  }
  .button-btn button{
    padding: 10px;
    border: none;
    border-radius: 5px;
    height: 45px;
    width: 100%;
    background: green;
    color: white;
    font-weight: bold;
    cursor: pointer;
    
  }
  .button-btn button:hover{
    background: greenyellow;
  }
  .pay{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-left: 40px;
    cursor: pointer;
    background: rgb(17, 19, 17);
    color: white;
  }
</style>
<body>
 <header>
  <div class="logo"><a href="#"><img src="./image/aura-logo.svg" alt="Aura Logo" width="50"></a><span>AURA</span>&CO<br>  
  </div>
  <nav id="navMenu">
    <ul>
      <li><a href="#top">Home</a></li>
      <li><a href="productsforstudent.html">Products</a></li>
      <li><a href="ourservices.html">Our Services</a></li>
    </ul>
  </nav>
  <div class="header-icons">
    <button aria-label="Search">🔍</button>
    <button aria-label="Account">👤</button>
    <button aria-label="Cart" id="cartBtn">🛍️<span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>
  <img src="./image/mingcute--arrow-left-fill.svg" alt="arrow-left" class="arrow-left">
  <div class="container">
        <h3 class="header">order summary</h3>
        <div class="section">
            <div class="title">
                <h3>image</h3>
                <h3>Quantity</h3>
                <h3>Products</h3>
                <h3>Price</h3>
            </div>
            <div class="title product-1">
                <img src="./image/pullover.jpg" alt="" width="50px" height="50px">
                <span class="num">02</span>
                <span class="prodNa">Pullover</span>
                <span class="price">300000FCFA</span>
            </div>
            <div class="title product-2">
                <img src="./image/t-shirt.jpg" alt="" width="50px" height="50px">
                <span class="num">02</span>
                <span class="prodNa">t-shift</span>
                <span class="price">300000FCFA<span>
            </div>
    </div>
    <div class="button-btn">
        <button onclick="window.location.href='./payment.html'">Process of Payment</button>
        <button class="pay">
            <span>Total <b>:<b></span>
            <span>300000FCFA</span>
            
        </button>
    </div>
  </div>  
</body>
</html>
