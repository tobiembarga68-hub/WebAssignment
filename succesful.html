<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>successul</title>
    <link rel="icon" href="./image/aura-logo.svg" type="image/icons">
    <style>
        body{
            display: flex;
            justify-content: center;            
        }
        .main{
            margin: 100px auto;
            background: rgb(78, 224, 86);
            width: 400px;
            height: 315px;
            padding: 10px;
            border-radius: 10px;
            position: relative;
           
        }
        .middle{
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .logo{
            background: rgb(6, 185, 15);
            border-radius:50%;
            align-items: center;
            width: 100px;
            height: 100px;
            border: none;
            border: 4px solid #04e404;
            box-shadow: 1px 2px rgb(6, 250, 47);
        
        }

        .main img{
            display: flex;
            align-content: flex-end;
        }
        p{
            font-size: 30px;
            color: white;
            font-weight: bold;
            cursor: default;
        }
        .ok{
            padding: 10px;
            width: 20%;
            font-weight: bold;
            border: none;
            font-size: 15px;
            background: #20f520;
            border-radius: 15px;
            color: white;
            transition: background 3s, transform 2s;
        }
        .ok:hover{
            background: white;
            color: black;
            transform: rotate(360deg);
            margin: 5px 0;
        }
        img{
            cursor: pointer;

        }


    </style>
</head>
<body>
    <div class="main">
        <img src="./image/basil--cross-outline.svg" alt="cross-icon" width="30px">
      <div class="middle">  
        <button class="logo class-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="5em" height="5em" viewBox="0 0 24 24" >
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m5 13l4 4L19 7" />
                </svg>
            </button>
        <P>successful Payment <span>🎉</span></P>
        <button class="ok" onclick="window.location.href='./productsforstudent.html'">ok</button>
     </div>

    </div>
</body>
</html>
